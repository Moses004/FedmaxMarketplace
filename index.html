<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Primary Meta Tags -->
    <title>Rentora RealEstate | Verified Property Rentals & Marketplace</title>
    <meta name="title" content="Rentora RealEstate | Verified Property Rentals & Marketplace" />
    <meta name="description" content="Rentora RealEstate connects verified tenants and landlords across Europe and globally. Find luxury apartments, long-term rentals, studio flats, and verified homes with instant online lease verification and direct payouts." />
    <meta name="keywords" content="Rentora, Rentora RealEstate, property rentals, apartments for rent, verified landlords, rental marketplace, Madrid rentals, Barcelona apartments, Lagos property, long term rentals, Paystack direct payouts" />
    <meta name="author" content="Rentora RealEstate Inc." />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rentora RealEstate" />
    <meta property="og:title" content="Rentora RealEstate | Verified Property Rentals & Marketplace" />

    <meta property="twitter:title" content="Rentora RealEstate | Verified Property Rentals & Marketplace" />
    <meta property="twitter:description" content="Discover and rent verified properties worldwide. Secure lease agreements, real-time map discovery, and direct landlord payouts." />

    <!-- Paystack SDK -->
    <script src="https://js.paystack.co/v1/inline.js"></script>

    <!-- Structured Data (JSON-LD) for Google SEO Indexing -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "#organization",
          "name": "Rentora RealEstate",
          "url": "https://rentora-realestate.com",
          "logo": "https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=500&q=80",
          "description": "Global verified real estate and property rental marketplace.",
          "email": "support@rentora.com"
        },
        {
          "@type": "WebSite",
          "@id": "#website",
          "url": "https://rentora-realestate.com",
          "name": "Rentora RealEstate",
          "description": "Verified property rentals, luxury apartments, and long-term accommodation marketplace.",
          "publisher": { "@id": "#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://rentora-realestate.com/?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "RealEstateAgent",
          "@id": "#realestateagent",
          "name": "Rentora RealEstate Market",
          "image": "https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=800&q=80",
          "priceRange": "€€€",
          "description": "Connecting verified tenants and landlords with digital leases and secure payments."
        }
      ]
    }
    </script>
